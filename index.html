<!DOCTYPE html>
<html>
<head>
<title>Go Broken Link Checker - by Fari Mazhar</title>
<style>
body{font-family:Arial; text-align:center; padding:50px; background:#f5f5f5}
input{width:60%; padding:15px; border-radius:10px; border:2px solid #333}
button{padding:15px 30px; background:black; color:white; border-radius:10px; cursor:pointer; margin-left:10px}
.box{margin-top:30px; padding:20px; background:white; border-radius:15px; text-align:left}
.ok{color:green} .broken{color:red; font-weight:bold}
</style>
</head>
<body>
<h1>🔍 Go Broken Link Checker</h1>
<p>Built by Fari Mazhar | Golang Developer</p>
<input id="url" placeholder="Enter Website URL e.g. https://example.com">
<button onclick="check()">Check Now</button>
<div id="result" class="box">Results will show here...</div>

<script>
function check(){
 let url = document.getElementById('url').value;
 if(!url) return alert("URL likho!");
 document.getElementById('result').innerHTML = "Checking links of " + url + "... (This is v1 Demo)";
 // v2 me backend connect hoga
 setTimeout(()=>{
   document.getElementById('result').innerHTML = `
   <h3>Scan Complete for: ${url}</h3>
   <p class="ok">✅ OK - 200 - ${url}/about</p>
   <p class="ok">✅ OK - 200 - ${url}/contact</p>
   <p class="broken">❌ BROKEN - 404 - ${url}/old-page</p>
   <p class="broken">❌ BROKEN - 404 - ${url}/deleted-blog</p>
   <p><br><b>Note:</b> This is Frontend v1. Backend (Go) will be connected soon for live checking.</p>
   `;
 }, 1500);
}
</script>
</body>
</html>
